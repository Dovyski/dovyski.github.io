{% include easteregg.html %}
<head>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">

  {% assign page_description = page.description | default: site.description %}
  <meta content="{% if page.title == 'About' %}{{ site.title }} · {{ site.tagline }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}" property="og:title" />
  <meta content="{{ site.title }}" property="og:site_name" />
  <meta content="{{ page_description }}" property="og:description" />
  <meta content="{{ page_description }}" name="description" />
  <meta content="profile" property="og:type" />
  <meta content="{{ site.url }}" property="og:url" />
  <meta content="{{ site.url }}/public/img/fernando-bevilacqua.png" property="og:image" />

  <title>
    {% if page.title == "About" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}public/css/site.css?202201291823">
  <link rel="stylesheet" href="{{ site.baseurl }}public/css/modern.css?20260920-4">
  <link rel="stylesheet" href="{{ site.baseurl }}public/css/editorial.css?20260920-1">
  <link rel="stylesheet" href="{{ site.baseurl }}public/css/spaceflight.css?20260920-1">
  <link rel="stylesheet" href="{{ site.baseurl }}public/css/mission-panels.css?20260920-1">
  <link rel="stylesheet" href="{{ site.baseurl }}public/css/mission-polish.css?20260921-2">
  <link rel="stylesheet" href="{{ site.baseurl }}public/css/astronaut-tether.css?20260925-1">
  <link rel="stylesheet" href="{{ site.baseurl }}public/css/engineering.css?20260923-6">

  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ site.baseurl }}public/apple-touch-icon-144-precomposed.png">
  <link rel="shortcut icon" href="{{ site.baseurl }}public/favicon.ico">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/atom.xml">
</head>
